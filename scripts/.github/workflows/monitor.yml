name: Infrastructure Monitor

on:
  schedule:
    - cron: '*/15 * * * *'   # runs every 15 minutes
  workflow_dispatch:          # lets you also run it manually anytime

permissions:
  contents: write

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run status check
        run: |
          chmod +x scripts/check_status.sh
          ./scripts/check_status.sh

      - name: Generate badge
        run: |
          STATUS=$(cat current_status.txt)
          if [ "$STATUS" == "UP" ]; then
            echo "COLOR=brightgreen" >> $GITHUB_ENV
            echo "LABEL=All Systems Operational" >> $GITHUB_ENV
          else
            echo "COLOR=red" >> $GITHUB_ENV
            echo "LABEL=Issue Detected" >> $GITHUB_ENV
          fi

      - name: Commit updated logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status_log.csv current_status.txt
          git commit -m "Update status log [automated]" || echo "No changes to commit"
          git push
